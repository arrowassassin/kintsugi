name: Publish to MCP Registry

# Lists a published crate version in the official MCP Registry
# (registry.modelcontextprotocol.io) as io.github.kintsugi-tools/kintsugi.
# Manual on purpose: publishing stays a human step (CLAUDE.md STOP list), so
# the maintainer runs this after `cargo publish` of the same version. The
# registry verifies ownership from the visible `mcp-name:` line in the crate
# README on crates.io. GitHub OIDC proves the namespace; no stored token.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Crate version already on crates.io (for example 0.4.1)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version is on crates.io
        run: |
          curl -fsS https://index.crates.io/ki/nt/kintsugi | grep -q "\"vers\":\"${VERSION}\"" \
            || { echo "kintsugi ${VERSION} is not on crates.io yet; publish it first"; exit 1; }
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Set version
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > s.json && mv s.json server.json
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
